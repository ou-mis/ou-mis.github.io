<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MIS TA Assignment Tool</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <h1>MIS TA Assignment Tool</h1>
      <span id="term-label" class="term-label"></span>
    </div>
    <div class="header-actions">
      <span id="save-status" class="save-status"></span>
      <button type="button" data-action="save-json" class="btn">Save state (.json)</button>
      <label class="btn btn-secondary file-btn">Load state
        <input type="file" id="load-json" accept=".json,application/json" hidden>
      </label>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button type="button" class="tab active" data-tab="setup">1. Setup</button>
    <button type="button" class="tab" data-tab="import">2. Import</button>
    <button type="button" class="tab" data-tab="assign">3. Assign</button>
    <button type="button" class="tab" data-tab="tas">4. TAs</button>
    <button type="button" class="tab" data-tab="export">5. Export</button>
  </nav>

  <main>
    <section id="tab-setup" class="panel active"></section>
    <section id="tab-import" class="panel"></section>
    <section id="tab-assign" class="panel"></section>
    <section id="tab-tas" class="panel"></section>
    <section id="tab-export" class="panel"></section>
  </main>

  <div id="toast" class="toast" hidden></div>

  <script src="vendor/papaparse.min.js"></script>
  <script src="vendor/exceljs.min.js"></script>
  <script src="vendor/pizzip.min.js"></script>
  <script src="vendor/docxtemplater.js"></script>
  <script src="vendor/jszip.min.js"></script>
  <script src="vendor/FileSaver.min.js"></script>
  <script src="js/time.js"></script>
  <script src="js/parsers.js"></script>
  <script src="js/state.js"></script>
  <script src="js/matching.js"></script>
  <script src="js/exports.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
